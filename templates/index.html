<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта концертов группы АЗОН</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #2d3748; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px 20px; text-align: center; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25); }
        header h1 { font-size: 1.75em; font-weight: 700; margin-bottom: 8px; color: #fff; letter-spacing: -0.5px; }
        header p { opacity: 0.95; font-size: 0.95em; color: rgba(255,255,255,0.9); font-weight: 400; }
        .stats-bar { background: #fff; padding: 12px 20px; display: flex; justify-content: center; gap: 24px; border-bottom: 1px solid #e2e8f0; font-size: 0.85em; color: #64748b; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-value { font-weight: 600; color: #667eea; }
        #map-container { display: flex; height: calc(100vh - 140px); }
        #map { flex: 1; height: 100%; background: #e8ecf1; }
        #sidebar { width: 380px; background: #fff; overflow-y: auto; border-left: 1px solid #e2e8f0; box-shadow: -4px 0 15px rgba(0,0,0,0.04); }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #f1f5f9; }
        #sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .concert-item { padding: 18px 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: all 0.2s ease; background: #fff; }
        .concert-item:hover { background: #f8fafc; border-left: 3px solid #667eea; padding-left: 17px; }
        .concert-date { color: #667eea; font-weight: 600; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .concert-city { font-size: 1.15em; font-weight: 500; color: #1a202c; }
        .loading { text-align: center; padding: 60px 20px; color: #718096; font-size: 0.95em; }
        .error-message { text-align: center; padding: 60px 20px; color: #e53e3e; font-size: 0.95em; background: #fff5f5; }
        .marker-popup { min-width: 160px; }
        .marker-popup strong { display: block; margin-bottom: 10px; color: #2d3748; font-size: 1.1em; }
        .marker-popup .popup-date { color: #667eea; font-weight: 600; font-size: 0.95em; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }
        .marker-popup .popup-date:last-child { border-bottom: none; }
        .marker-cluster-small { background-color: rgba(102, 126, 234, 0.4); }
        .marker-cluster-small div { background-color: rgba(102, 126, 234, 0.8); color: white; font-weight: 600; }
        .marker-cluster-medium { background-color: rgba(118, 75, 162, 0.4); }
        .marker-cluster-medium div { background-color: rgba(118, 75, 162, 0.8); color: white; font-weight: 600; }
        .marker-cluster-large { background-color: rgba(147, 51, 234, 0.4); }
        .marker-cluster-large div { background-color: rgba(147, 51, 234, 0.8); color: white; font-weight: 600; }
        @media (max-width: 768px) { 
            #map-container { flex-direction: column; } 
            #sidebar { width: 100%; height: 220px; border-left: none; border-top: 1px solid #e2e8f0; } 
            header h1 { font-size: 1.4em; } 
            .stats-bar { flex-wrap: wrap; gap: 12px; } 
        }
        .refresh-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
        }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5); }
        .refresh-btn:active { transform: translateY(0); }
        .refresh-btn.loading { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>🎸 Карта концертов группы АЗОН</h1>
        <p>Даты и города предстоящих выступлений</p>
    </header>
    <div class="stats-bar">
        <div class="stat-item">Концертов: <span class="stat-value" id="stat-count">0</span></div>
        <div class="stat-item">Городов: <span class="stat-value" id="stat-cities">0</span></div>
        <div class="stat-item">Кэш: <span class="stat-value" id="stat-cache">-</span></div>
        <div class="stat-item">Статус: <span class="stat-value" id="stat-health">Загрузка...</span></div>
    </div>
    <div id="map-container">
        <div id="map"></div>
        <div id="sidebar">
            <div class="loading" id="loading-indicator">
                <div style="animation: pulse 1.5s infinite;">
                    <svg style="width: 40px; height: 40px; margin: 0 auto 10px;" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round">
                            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                    Загрузка концертов...
                </div>
            </div>
        </div>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="loadConcerts()" title="Обновить данные">
        🔄 Обновить
    </button>

    <script>
        const map = L.map('map').setView([55.7558, 37.6173], 5);
        const apiKey = "{{ api_key }}" || "";
        let tileUrl = apiKey ? `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${apiKey}` : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
        L.tileLayer(tileUrl, { 
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>', 
            subdomains: 'abcd', 
            maxZoom: 19 
        }).addTo(map);
        
        const markers = L.markerClusterGroup({ 
            showCoverageOnHover: false, 
            maxClusterRadius: 50, 
            spiderfyOnMaxZoom: true 
        });
        map.addLayer(markers);
        
        const sidebar = document.getElementById('sidebar');
        const loadingIndicator = document.getElementById('loading-indicator');
        const refreshBtn = document.getElementById('refresh-btn');
        const concertIcon = L.divIcon({ 
            className: 'custom-marker', 
            html: '<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);"></div>', 
            iconSize: [20, 20], 
            iconAnchor: [10, 10] 
        });
        
        function updateStats(count, cities) { 
            document.getElementById('stat-count').textContent = count; 
            document.getElementById('stat-cities').textContent = cities; 
        }
        
        function updateHealthStatus(status) {
            const healthEl = document.getElementById('stat-health');
            if (status === 'healthy') {
                healthEl.textContent = '✓ OK';
                healthEl.style.color = '#38a169';
            } else {
                healthEl.textContent = '⚠ Проблемы';
                healthEl.style.color = '#e53e3e';
            }
        }
        
        function showError(message) {
            sidebar.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            updateHealthStatus('unhealthy');
        }
        
        async function loadConcerts() {
            refreshBtn.classList.add('loading');
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch('/api/concerts', { 
                    cache: 'no-cache' 
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const concerts = await response.json();
                sidebar.innerHTML = '';
                
                if (!concerts.length) { 
                    sidebar.innerHTML = '<div class="loading">Концерты не найдены</div>'; 
                    updateStats(0, 0); 
                    return; 
                }
                
                const cityConcerts = {};
                concerts.forEach(c => { 
                    if (!cityConcerts[c.city]) cityConcerts[c.city] = []; 
                    cityConcerts[c.city].push(c); 
                });
                updateStats(concerts.length, Object.keys(cityConcerts).length);
                
                // Clear existing markers
                markers.clearLayers();
                
                Object.keys(cityConcerts)
                    .sort((a, b) => {
                        const dateA = cityConcerts[a][0].date.split('.').reverse().join('');
                        const dateB = cityConcerts[b][0].date.split('.').reverse().join('');
                        return dateA.localeCompare(dateB);
                    })
                    .forEach(city => {
                        const cityData = cityConcerts[city];
                        const marker = L.marker([cityData[0].lat, cityData[0].lng], {icon: concertIcon});
                        let popup = '<div class="marker-popup"><strong>📍 ' + city + '</strong>';
                        cityData.forEach(c => popup += '<div class="popup-date">' + c.date + '</div>');
                        popup += '</div>';
                        marker.bindPopup(popup);
                        markers.addLayer(marker);
                        
                        const item = document.createElement('div');
                        item.className = 'concert-item';
                        item.innerHTML = '<div class="concert-date">' + cityData.map(c => c.date).join(', ') + '</div><div class="concert-city">' + city + '</div>';
                        item.onclick = () => { 
                            map.setView([cityData[0].lat, cityData[0].lng], 10, {animate: true, duration: 0.5}); 
                            marker.openPopup(); 
                        };
                        sidebar.appendChild(item);
                    });
                
                updateHealthStatus('healthy');
                
            } catch (e) { 
                console.error('Error loading concerts:', e); 
                showError('Ошибка загрузки данных: ' + e.message); 
            } finally {
                refreshBtn.classList.remove('loading');
                refreshBtn.disabled = false;
            }
        }
        
        async function loadStats() {
            try {
                const s = await fetch('/api/stats').then(r => r.json()); 
                document.getElementById('stat-cache').textContent = s.cache_enabled ? 'Вкл' : 'Выкл';
            } catch (e) { 
                console.error('Error loading stats:', e);
            }
        }
        
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                updateHealthStatus(data.status);
            } catch (e) {
                console.error('Health check failed:', e);
                updateHealthStatus('unhealthy');
            }
        }
        
        // Initial load
        loadConcerts();
        loadStats();
        checkHealth();
        
        // Periodic health check
        setInterval(checkHealth, 60000);
    </script>
</body>
</html>
